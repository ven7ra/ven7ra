<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="420" viewBox="0 0 1500 420" role="img" aria-labelledby="title desc">
  <title id="title">VEN7RA — Systems, Automation, Sound</title>
  <desc id="desc">A dark futuristic banner with electric blue circuitry and VEN7RA branding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/><stop offset=".55" stop-color="#0b1420"/><stop offset="1" stop-color="#030509"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0878d8"/><stop offset=".5" stop-color="#39b8ff"/><stop offset="1" stop-color="#0755a5"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".48" stop-color="#aeb8c5"/><stop offset="1" stop-color="#596575"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#17324b" stroke-width="1" opacity=".42"/>
      <circle cx="1" cy="1" r="1.3" fill="#218bd4" opacity=".45"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1500" height="420" fill="url(#bg)"/>
  <rect width="1500" height="420" fill="url(#grid)" opacity=".65"/>
  <path d="M0 320H180l42-42h165l35-35h130M1500 105h-175l-35 35h-150l-48 48h-145" fill="none" stroke="url(#blue)" stroke-width="2" opacity=".8"/>
  <path d="M0 350h300l28-28h115M1500 285h-230l-30 30h-180" fill="none" stroke="#0878d8" stroke-width="1" opacity=".55"/>
  <path d="M72 0v120l36 36v85M1428 0v95l-32 32v80" fill="none" stroke="#168bff" stroke-width="2" opacity=".65"/>
  <g opacity=".22" fill="#10253a">
    <path d="M900 320l65-105 30 38 44-88 40 64 45-112 54 203z"/>
    <path d="M1080 320l70-75 35 35 40-56 70 96z"/>
  </g>
  <g fill="#42baff" opacity=".9" filter="url(#glow)">
    <circle cx="180" cy="320" r="3"/><circle cx="1350" cy="140" r="3"/><circle cx="1190" cy="315" r="2.5"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="120" y="104" fill="#53bfff" font-size="14" letter-spacing="4">LINUX  /  SYSTEMS  /  AUTOMATION</text>
    <text x="112" y="226" fill="url(#metal)" font-size="104" font-weight="800" letter-spacing="5">VEN7RA</text>
    <path d="M120 252H805" stroke="url(#blue)" stroke-width="3" filter="url(#glow)"/>
    <text x="124" y="294" fill="#dce7f2" font-size="24" letter-spacing="8">SYSTEMS  //  AUTOMATION  //  SOUND</text>
    <text x="126" y="350" fill="#7f91a5" font-size="15" letter-spacing="3">BUILD. AUTOMATE. CREATE.</text>
    <text x="1378" y="370" fill="#268bd2" font-size="12" letter-spacing="3" text-anchor="end">[ ONLINE ]</text>
  </g>
  <path d="M30 30h46M30 30v46M1470 30h-46M1470 30v46M30 390h46M30 390v-46M1470 390h-46M1470 390v-46" fill="none" stroke="#168bff" stroke-width="2" opacity=".8"/>
